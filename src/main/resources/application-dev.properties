spring.application.name=api
server.port=8080

api.security.token.secret=${JWT_SECRET}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.security.oauth2.client.registration.google.client-id=${CLIENT_ID}

cloudflare.r2.account-id=${CLOUDFLARE_TOKEN}
cloudflare.r2.access-key=${CLOUDFLARE_ACCESS_KEY_ID}
cloudflare.r2.secret-key=${CLOUDFLARE_SECRET_ACCESS_KEY}
cloudflare.r2.bucket=${CLOUDFLARE_BUCKET_NAME}
cloudflare.r2.public-url=${CLOUDFLARE_PUBLIC_URL}

springdoc.swagger-ui.path=/index.html
springdoc.api-docs.path=/docs

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.web.error.include-stacktrace=never

spring.mail.host=mail
spring.mail.port=1025
spring.mail.username=arvenisdev@gmail.com
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false