services:
  postgres:
    image: postgres:16
    container_name: lal-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mail:
    image: mailhog/mailhog:latest
    container_name: lal-mail
    entrypoint: ["sh", "-c", "exec MailHog > /dev/null 2>&1"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "1025:1025"
      - "8025:8025"

  app:
    build: .
    container_name: lal-api
    depends_on:
      postgres:
        condition: service_healthy
      mail:
        condition: service_started
    ports:
      - "8080:8080"
    env_file:
      - .env.dev

volumes:
  postgres_data: