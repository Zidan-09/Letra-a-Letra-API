name: CI pipeline

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build API
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

  unit-tests:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Unit Tests
        run: |
          chmod +x mvnw
          ./mvnw test
          
  integration-tests:
    needs: unit-tests
    runs-on: ubuntu-latest

    services:
      mailhog:
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Build API
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests
          
      - name: Start API
        env:
          SPRING_PROFILES_ACTIVE: test
        run: |
          JAR=$(ls target/*.jar | head -n 1)
          nohup java -jar "$JAR" --spring.profiles.active=test > api.log 2>&1 &
          echo $! > api.pid

      - name: Wait API
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 2
          done
          
          echo "API não iniciou"
          cat api.log
          exit 1

      - name: Install integration test dependencies
        working-directory: tools
        run: npm ci

      - name: Run integration tests
        working-directory: tools
        run: node runner.js

      - name: Show API log on failure
        if: failure()
        run: cat api.log

      - name: Stop API
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill $(cat api.pid) || true
          fi